
name: Build Molakhassati APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Generate Android files
        run: flutter create --platforms=android --project-name molakhassati_third_intermediate .

      - name: Remove default test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/Molakhassati.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: molakhassati-apk
          path: release/Molakhassati.apk
          if-no-files-found: error
