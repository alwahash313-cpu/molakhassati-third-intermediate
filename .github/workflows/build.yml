
name: Build Molakhassati APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Generate Android files
        run: flutter create --platforms=android --project-name molakhassati_third_intermediate .

      - name: Remove default test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK package
        run: |
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt dump badging build/app/outputs/flutter-apk/app-release.apk

      - name: Create release folder
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/Molakhassati.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: ملخصاتي 1.0.2
          body: الإصدار التجريبي الجديد من تطبيق ملخصاتي للثالث متوسط العراقي.
          files: release/Molakhassati.apk
          fail_on_unmatched_files: true
